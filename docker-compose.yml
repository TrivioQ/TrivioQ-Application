# =============================================================================
# TrivioQ — Docker Compose
# =============================================================================
# Beta target: AutomationServer @ 192.168.0.101
#
# Services:
#   postgres          — PostgreSQL 16 (persistent data volume)
#   redis             — Redis 7 (persistent data volume)
#   migrate           — One-shot Prisma migration runner (exits after completion)
#   api               — Express REST API + BullMQ workers  (port 3013)
#   web               — Next.js 14 user-facing app         (port 3011)
#   admin             — Next.js 16 admin dashboard         (port 3012)
#   glitchtip-web     — GlitchTip error tracking UI/API   (port 8000, internal only)
#   glitchtip-worker  — GlitchTip Celery background worker
#   glitchtip-beat    — GlitchTip Celery Beat scheduler
#
# Usage (AutomationServer):
#   docker compose up -d
#   docker compose logs -f
#   docker compose ps
# =============================================================================

name: trivioq

# ---------------------------------------------------------------------------
# Shared network — all services communicate over this internal bridge
# ---------------------------------------------------------------------------
networks:
  trivioq-network:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes — persistent data survives container restarts
# ---------------------------------------------------------------------------
volumes:
  trivioq_postgres_data:
  trivioq_redis_data:
  trivioq_glitchtip_uploads:

# ---------------------------------------------------------------------------
# Reusable YAML anchors
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Shared environment for all three GlitchTip containers
x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${GLITCHTIP_POSTGRES_DB:-glitchtip}
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY is required}
  PORT: 8000
  EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?GLITCHTIP_DOMAIN is required (e.g. https://logs.trivioq.com)}
  DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-noreply@trivioq.com}
  CELERY_BROKER_URL: redis://redis:6379/1
  REDIS_URL: redis://redis:6379/1
  CELERY_WORKER_AUTOSCALE: "1,3"
  DEFAULT_AUTO_FIELD: django.db.models.BigAutoField
  # Disable public registration — accounts are created only via the init service or CLI
  REGISTRATION_OPEN: "False"
  # Superuser seed credentials (used by glitchtip-init on first boot)
  DJANGO_SUPERUSER_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:?GLITCHTIP_ADMIN_EMAIL is required}
  DJANGO_SUPERUSER_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:?GLITCHTIP_ADMIN_PASSWORD is required}

# ===========================================================================
# SERVICES
# ===========================================================================
services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: trivioq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trivioq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-trivioq}
    ports:
      - "5432:5432"
    volumes:
      - trivioq_postgres_data:/var/lib/postgresql/data
    networks:
      - trivioq-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-trivioq} -d ${POSTGRES_DB:-trivioq}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
  # -------------------------------------------------------------------------
  # PgBouncer Connection Pooler
  # -------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: trivioq-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "6432:6432"
    networks:
      - trivioq-network
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Redis 7
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trivioq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - trivioq_redis_data:/data
    networks:
      - trivioq-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Prisma Migrate — one-shot service that runs migrations then exits
  # The API will only start after this service completes successfully.
  # -------------------------------------------------------------------------
  migrate:
    image: trivioq-api:latest
    container_name: trivioq-migrate
    restart: "no" # exits after running — intentional
    command: >
      sh -c "
        cd /app/node_modules/@trivioq/database &&
        npx prisma migrate deploy
      "
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
    networks:
      - trivioq-network
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # -------------------------------------------------------------------------
  # API — Express REST API + BullMQ background workers
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: trivioq-api:latest
    container_name: trivioq-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3013
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:-trivioq}?schema=public&pgbouncer=true
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase-service-account.json
    ports:
      - "3013:3013"
    volumes:
      # Firebase service account injected at runtime — never baked into the image
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-./firebase-service-account.json}:/secrets/firebase-service-account.json:ro
    networks:
      - trivioq-network
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3013/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Worker: General Cron (Weekly/Monthly bonuses, drop planner)
  # -------------------------------------------------------------------------
  worker-cron:
    image: trivioq-api:latest
    container_name: trivioq-worker-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:-trivioq}?schema=public&pgbouncer=true
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-./firebase-service-account.json}:/secrets/firebase-service-account.json:ro
    networks:
      - trivioq-network
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "dist/cron.js"]
    healthcheck:
      disable: true
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Worker: Push Notification Dispatcher
  # -------------------------------------------------------------------------
  worker-dispatcher:
    image: trivioq-api:latest
    container_name: trivioq-worker-dispatcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:-trivioq}?schema=public&pgbouncer=true
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-./firebase-service-account.json}:/secrets/firebase-service-account.json:ro
    networks:
      - trivioq-network
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "dist/workers/dispatcher.js"]
    healthcheck:
      disable: true
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Worker: Trivia Drop Processor
  # -------------------------------------------------------------------------
  worker-drop:
    image: trivioq-api:latest
    container_name: trivioq-worker-drop
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:-trivioq}?schema=public&pgbouncer=true
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-./firebase-service-account.json}:/secrets/firebase-service-account.json:ro
    networks:
      - trivioq-network
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "dist/workers/drop-worker.js"]
    healthcheck:
      disable: true
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Worker: Notification Processor (Push, Web Push, Email dispatch)
  # -------------------------------------------------------------------------
  worker-notification:
    image: trivioq-api:latest
    container_name: trivioq-worker-notification
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:-trivioq}?schema=public&pgbouncer=true
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT_PATH: /secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-./firebase-service-account.json}:/secrets/firebase-service-account.json:ro
    networks:
      - trivioq-network
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "dist/workers/notification-worker.js"]
    healthcheck:
      disable: true
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Worker: Email Processor
  # -------------------------------------------------------------------------
  worker-email:
    image: trivioq-api:latest
    container_name: trivioq-worker-email
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:-trivioq}?schema=public&pgbouncer=true
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required for email delivery}
    networks:
      - trivioq-network
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "dist/workers/email-worker.js"]
    healthcheck:
      disable: true
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Web — Next.js 14 user-facing application
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    image: trivioq-web:latest
    container_name: trivioq-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3011
      HOSTNAME: "0.0.0.0"
      # Internal service URL (container-to-container, not localhost)
      API_URL: http://api:3013
    ports:
      - "3011:3011"
    networks:
      - trivioq-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3011/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Admin — Next.js 16 admin dashboard
  # -------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: runner
    image: trivioq-admin:latest
    container_name: trivioq-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3012
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:-trivioq}?schema=public&pgbouncer=true
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-trivioq}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-trivioq}?schema=public
      API_URL: http://api:3013
    ports:
      - "3012:3012"
    networks:
      - trivioq-network
    depends_on:
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3012/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # GlitchTip — Self-hosted error tracking (Sentry-compatible)
  # Accessible via Cloudflare Tunnel at GLITCHTIP_DOMAIN (e.g. https://logs.trivioq.com)
  # Uses the existing postgres service (separate 'glitchtip' database)
  # Uses redis DB index 1 (TrivioQ uses index 0) to avoid key collisions
  # -------------------------------------------------------------------------
  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: trivioq-glitchtip-web
    restart: unless-stopped
    environment:
      <<: *glitchtip-env
    ports:
      - "8000:8000" # Exposed for Cloudflare Tunnel and local verification
    volumes:
      - trivioq_glitchtip_uploads:/code/uploads
    networks:
      - trivioq-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/'')" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: trivioq-glitchtip-worker
    restart: unless-stopped
    command: ["./bin/run-worker.sh"]
    environment:
      <<: *glitchtip-env
    volumes:
      - trivioq_glitchtip_uploads:/code/uploads
    networks:
      - trivioq-network
    depends_on:
      glitchtip-web:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  # -------------------------------------------------------------------------
  # GlitchTip Init — one-shot superuser seeder (exits after completion)
  # Runs ./manage.py createsuperuser --noinput using DJANGO_SUPERUSER_* vars.
  # Safe to re-run: Django skips creation if the email already exists.
  # -------------------------------------------------------------------------
  glitchtip-init:
    image: glitchtip/glitchtip:latest
    container_name: trivioq-glitchtip-init
    restart: "no" # exits after running — intentional
    command: ["./manage.py", "createsuperuser", "--noinput"]
    environment:
      <<: *glitchtip-env
    networks:
      - trivioq-network
    depends_on:
      glitchtip-web:
        condition: service_healthy
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Cloudflare Tunnel (cloudflared)
  # Routes:
  #   trivioq.com / app.trivioq.com  → web:3011
  #   admin.trivioq.com              → admin:3012
  #   api.trivioq.com                → api:3013
  #   logs.trivioq.com               → glitchtip-web:8000
  # Configure these upstreams in the Cloudflare Zero Trust dashboard.
  # -------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: trivioq-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - trivioq-network
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      glitchtip-web:
        condition: service_healthy
